<script>
    (function() {
        const LICENCIA = {
            PRODUCTO: 'CYMATIC STUDIO Omni-Sensory',
            VERSION: 'v15.0'
        };
        function obtenerLicencia() {
            let licencia = localStorage.getItem('cymatic_licencia');
            if (licencia) return licencia;
            licencia = sessionStorage.getItem('cymatic_licencia');
            if (licencia) return licencia;
            const urlParams = new URLSearchParams(window.location.search);
            licencia = urlParams.get('licencia');
            if (licencia) { localStorage.setItem('cymatic_licencia', licencia); return licencia; }
            return null;
        }
        function validarLicencia(clave) {
            if (!clave) return false;
            if (clave.startsWith('CYMATIC-') && clave.length >= 10) return true;
            return false;

        }
        window.ingresarLicencia = function() {
            const clave = prompt('🔑 Ingresa tu clave de licencia de CYMATIC STUDIO:');

<script>
    // ===== MOTOR CIMÁTICO v15.0 (con IA simulada) =====
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let mouse = { x: width/2, y: height/2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        let phase = 0;
        const lineCount = 60;
        const palettes = [
            ['rgba(0, 255, 204, 0.7)', 'rgba(168, 85, 247, 0.2)'],
            ['rgba(255, 200, 0, 0.7)', 'rgba(255, 0, 100, 0.2)'],
            ['rgba(0, 150, 255, 0.7)', 'rgba(0, 255, 100, 0.2)'],
            ['rgba(255, 50, 200, 0.7)', 'rgba(50, 200, 255, 0.2)'],
            ['rgba(200, 255, 50, 0.7)', 'rgba(255, 50, 100, 0.2)'],
            ['rgba(255, 100, 50, 0.7)', 'rgba(50, 100, 255, 0.2)']
        ];
        let paletteIndex = 0;
        setInterval(() => { paletteIndex = (paletteIndex + 1) % palettes.length; }, 3500);

        // Simulación de "IA generativa" – cambia patrones aleatoriamente
        let iaNoise = 0;
        setInterval(() => {
            iaNoise = Math.random() * 0.5 + 0.5;
        }, 2000);

        function animate() {
            ctx.fillStyle = 'rgba(2, 3, 8, 0.05)';
            ctx.fillRect(0, 0, width, height);

            phase += 0.007 + iaNoise * 0.002;
            const [col1, col2] = palettes[paletteIndex];
            const iaOffset = iaNoise * 10;

            for (let i = 0; i < lineCount; i++) {
                const y = (height / lineCount) * i + Math.sin(phase + i * 0.1) * iaOffset * 0.5;
                ctx.beginPath();
                ctx.lineWidth = i % 2 === 0 ? 2.2 : 0.8;
                const grad = ctx.createLinearGradient(0, 0, width, 0);
                grad.addColorStop(0, `rgba(168, 85, 247, ${0.1 + iaNoise * 0.1})`);
                grad.addColorStop(mouse.x / width, col1);
                grad.addColorStop(1, col2);
                ctx.strokeStyle = grad;

                for (let x = 0; x < width; x += 4) {
                    const dist = Math.abs(x - mouse.x);
                    const influence = Math.max(0, (350 - dist) / 350);
                    const wave = Math.sin(x * 0.015 + phase + i * 0.1) * (30 + iaNoise * 15);
                    const mouseWave = Math.sin(x * 0.035 + phase * 1.6) * (60 * influence) * (1 - Math.abs(mouse.y - y) / height);
                    const iaWave = Math.sin(x * 0.02 + phase * 0.8 + i) * iaNoise * 20;
                    const yPos = y + wave + mouseWave + iaWave;
                    if (x === 0) ctx.moveTo(x, yPos);
                    else ctx.lineTo(x, yPos);
                }
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }

        animate();
        console.log('🚀 CYMATIC STUDIO v15.0 · Omni-Sensory cargado (IA simulada).');
    })();
</script>
