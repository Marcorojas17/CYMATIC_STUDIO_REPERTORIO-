<script>
    (function() {
        const LICENCIA = {
            PRODUCTO: 'CYMATIC STUDIO Quantum Bloom',
            VERSION: 'v8.0'
        };
        function obtenerLicencia() {
            let licencia = localStorage.getItem('cymatic_licencia');
            if (licencia) return licencia;
            licencia = sessionStorage.getItem('cymatic_licencia');
            if (licencia) return licencia;
            const urlParams = new URLSearchParams(window.location.search);
            licencia = urlParams.get('licencia');
            if (licencia) { localStorage.setItem('cymatic_licencia', licencia); return licencia; }
            return null;
        }
        function validarLicencia(clave) {
            if (!clave) return false;
            if (clave.startsWith('CYMATIC-') && clave.length >= 10) return true;
            return false;
        }
        function mostrarBloqueo(mensaje) {
            document.body.innerHTML = `
                <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:#020308;color:#ff4d6d;font-family:'Courier New',monospace;padding:20px;text-align:center;">

                    <p style="color:#64748b;font-size:1rem;max-width:500px;line-height:1.6;">
                        Este software requiere una licencia válida para funcionar.
                        <br><br>
                        <span style="color:#00ffcc;">Contacta a soporte@cymaticstudio.com</span>
                        <br><br>
                        <button onclick="ingresarLicencia()" style="background:linear-gradient(135deg,#00ffcc,#a855f7);color:#000;border:none;padding:12px 32px;border-radius:40px;font-weight:800;cursor:pointer;font-size:1rem;font-family:'Courier New',monospace;margin-top:10px;">
                            🔑 Ingresar clave de licencia

                        <br><br>
                        <a href="checkout.html" style="color:#00ffcc;font-size:0.9rem;">🛒 Comprar licencia</a>
                    </p>
                </div>
            `;
        }
        window.ingresarLicencia = function() {
            const clave = prompt('🔑 Ingresa tu clave de licencia de CYMATIC STUDIO:');
            if (clave) {
                localStorage.setItem('cymatic_licencia', clave);
                location.reload();
            }
        };
        const licencia = obtenerLicencia();
        if (!licencia || !validarLicencia(licencia)) {
            mostrarBloqueo('⚠️ Licencia no encontrada o inválida');
        } else {
            console.log('✅ Licencia válida para CYMATIC STUDIO v8.0');
            const info = document.createElement('div');
            info.className = 'licencia-info';
            info.textContent = '✅ Licencia activa · v8.0 Quantum Bloom';
            document.body.appendChild(info);
        }
    })();
</script>

<script>
    // ===== MOTOR CIMÁTICO v8.0 (con Bloom simulado) =====
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let mouse = { x: width/2, y: height/2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        let phase = 0;
        const lineCount = 50;
        let bloomIntensity = 0.8;
        const palettes = [
            ['rgba(0, 255, 204, 0.6)', 'rgba(168, 85, 247, 0.2)'],
            ['rgba(255, 200, 0, 0.6)', 'rgba(255, 0, 100, 0.2)'],
            ['rgba(0, 150, 255, 0.6)', 'rgba(0, 255, 100, 0.2)'],
            ['rgba(255, 50, 200, 0.6)', 'rgba(50, 200, 255, 0.2)'],
            ['rgba(200, 255, 50, 0.6)', 'rgba(255, 50, 100, 0.2)']
        ];
        let paletteIndex = 0;
        setInterval(() => { paletteIndex = (paletteIndex + 1) % palettes.length; }, 4000);

        function animate() {
            // Fondo con rastro
            ctx.fillStyle = 'rgba(2, 3, 8, 0.06)';
            ctx.fillRect(0, 0, width, height);

            phase += 0.006;
            const [col1, col2] = palettes[paletteIndex];

            // Primera pasada: líneas principales
            for (let i = 0; i < lineCount; i++) {
                const y = (height / lineCount) * i;
                ctx.beginPath();
                ctx.lineWidth = i % 2 === 0 ? 2.0 : 0.8;
                const grad = ctx.createLinearGradient(0, 0, width, 0);
                grad.addColorStop(0, 'rgba(168, 85, 247, 0.15)');
                grad.addColorStop(mouse.x / width, col1);
                grad.addColorStop(1, col2);
                ctx.strokeStyle = grad;

                for (let x = 0; x < width; x += 5) {
                    const dist = Math.abs(x - mouse.x);
                    const influence = Math.max(0, (300 - dist) / 300);
                    const wave = Math.sin(x * 0.012 + phase + i * 0.12) * 30;
                    const mouseWave = Math.sin(x * 0.03 + phase * 1.8) * (50 * influence) * (1 - Math.abs(mouse.y - y) / height);
                    const yPos = y + wave + mouseWave;
                    if (x === 0) ctx.moveTo(x, yPos);
                    else ctx.lineTo(x, yPos);
                }
                ctx.stroke();
            }

            // Efecto Bloom: segunda pasada con opacidad baja y difuminado
            if (bloomIntensity > 0.1) {
                ctx.globalCompositeOperation = 'screen';
                for (let i = 0; i < lineCount; i += 3) {
                    const y = (height / lineCount) * i;
                    ctx.beginPath();
                    ctx.lineWidth = 4.0;
                    const grad = ctx.createLinearGradient(0, 0, width, 0);
                    grad.addColorStop(0, `rgba(168, 85, 247, ${bloomIntensity * 0.05})`);
                    grad.addColorStop(mouse.x / width, `rgba(0, 255, 204, ${bloomIntensity * 0.15})`);
                    grad.addColorStop(1, `rgba(255, 0, 204, ${bloomIntensity * 0.05})`);
                    ctx.strokeStyle = grad;

                    for (let x = 0; x < width; x += 8) {
                        const dist = Math.abs(x - mouse.x);
                        const influence = Math.max(0, (300 - dist) / 300);
                        const wave = Math.sin(x * 0.012 + phase + i * 0.12) * 30;
                        const mouseWave = Math.sin(x * 0.03 + phase * 1.8) * (50 * influence) * (1 - Math.abs(mouse.y - y) / height);
                        const yPos = y + wave + mouseWave;
                        if (x === 0) ctx.moveTo(x, yPos);
                        else ctx.lineTo(x, yPos);
                    }
                    ctx.stroke();
                }
                ctx.globalCompositeOperation = 'source-over';
            }

            requestAnimationFrame(animate);
        }

        animate();
        console.log('🚀 CYMATIC STUDIO v8.0 · Quantum Bloom cargado.');
    })();
</script>
